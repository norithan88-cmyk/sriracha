name: シラチャの大気質を自動更新

on:
  workflow_dispatch:
  schedule:
    - cron: '25 21 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: ファイルを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: シラチャのPM2.5等を収集
        run: node automation/air/collect-air.mjs

      - name: 変更があるときだけ保存
        shell: bash
        run: |
          if git diff --quiet -- automation/air/air.json; then
            echo "変更はありません"
            exit 0
          fi
          git config user.name "sriracha-navi-bot"
          git config user.email "sriracha-navi-bot@users.noreply.github.com"
          git add -- automation/air/air.json
          git commit -m "シラチャの大気質データを自動更新"
          git push
